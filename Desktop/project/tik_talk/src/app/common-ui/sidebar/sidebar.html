<img src="/assets/svg/logo-small.svg" alt="logo-small" class="ml16 mb20">

<nav>
    <ul class="main-menu-list">
        <li>
            @for (menuItem of menuItems; track menuItem.icon) {
            <a class="menu-item" [routerLink]="[menuItem.link]" routerLinkActive="active">
                <svg id="svg" [icon]="menuItem.icon"></svg>
                <span id="span">{{menuItem.label}}</span>
            </a>
            }
        </li>
    </ul>
</nav>

<p class="medium-text mb20 mt20 ml16">Подписчики</p>


<div class="subscribers-wrapper ml16 mt20 mb20">
    @for (subscriber of profiles$ | async; track subscriber.id) {
    <app-subscriber-card [profile]="subscriber"></app-subscriber-card>
    }
</div>

<div class="to-subscribers ml16">
    <a class="to-subscribers-link">Все подписчики</a>
</div>

@if (me(); as me) {
<footer class="sidebar__footer">
   @if (me.avatarUrl) {
    <img [src]="me.avatarUrl | imgUrl" alt="king" class="profile-image">
   }
   @else {
    <img src="/assets/images/user-placeholder.png" alt="placeholder" class="placeholder">
   }
   <div class="medium-text username-text">{{me.username}}</div>

   <a class="settings-btn" [routerLink]="['settings']">
    <svg icon="settings" class="to-settings-icon"></svg>
   </a>
</footer>
}
