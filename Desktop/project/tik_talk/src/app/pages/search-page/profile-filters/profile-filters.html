<form class="profile-search-form" [formGroup]="searchForm">
    <label class="tt-form-label">
        <span class="tt-form-label__text">Имя пользователя</span>
        <input type="text" class="tt-form-input" formControlName="firstName">
    </label>
    <label class="tt-form-label">
        <span class="tt-form-label__text">Фамилия пользователя</span>
        <input type="text" class="tt-form-input" formControlName="lastName">
    </label>
    <label class="tt-form-label">
        <span class="tt-form-label__text">Навыки(Стэк)</span>
        <textarea class="tt-form-input tt-textarea" rows="4" formControlName="stack"></textarea>
    </label>
</form>
