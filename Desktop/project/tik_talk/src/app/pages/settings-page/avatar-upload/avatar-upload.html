<img [src]="preview()" alt="">

<div class="dropzone"  tabindex="0" (keyup.enter)="fileDrop.click()" dnd (fileDropped)="onFileDropped($event)">
    <div class="dropzone-content">
        <svg  icon="upload"></svg>
        Перетащите изоброжение или Загрузите
        <input class="avatar-input" type="file" #fileDrop tabindex="-1" (change)="fileBrowserHandler($event)" [(ngModel)]="avatar">
    </div>
</div>
